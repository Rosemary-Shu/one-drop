<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F0">
  <meta name="description" content="一分钟，等叶尖上的一滴水慢慢长大，落进湖里。">
  <title>一分钟，等一滴水</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <button type="button" class="sound" id="btn-sound" hidden>声音：开</button>
  <div class="count" id="count" aria-hidden="true"><span></span><span></span></div>

  <section class="panel" id="panel-intro" aria-live="polite">
    <p class="line">等一滴水，慢慢长大。</p>
  </section>

  <section class="panel is-on" id="panel-start">
    <p class="line">等一滴水，慢慢长大。</p>
    <button type="button" class="btn" id="btn-start">开始</button>
  </section>

  <section class="panel" id="panel-end">
    <p class="line">一滴水的时间。</p>
    <button type="button" class="btn" id="btn-again">再等一滴</button>
  </section>

  <script src="app.js?v=3"></script>
</body>
</html>
